const KEY='autocare-pro-v1';const seed={settings:{name:'AutoCare Pro Garage',phone:'',email:'',address:'',currency:'LKR',tax:0},customers:[{id:1,name:'Nimal Perera',phone:'0771234567',email:''},{id:2,name:'Amara Silva',phone:'0714567890',email:''}],vehicles:[{id:1,plate:'CAB-4567',type:'Car',make:'Toyota',model:'Axio',year:2016,mileage:78200,customerId:1},{id:2,plate:'BCH-2345',type:'Motorcycle',make:'Honda',model:'Dio',year:2021,mileage:18500,customerId:2},{id:3,plate:'WP-7632',type:'Three-Wheeler',make:'Bajaj',model:'RE',year:2019,mileage:109000,customerId:1},{id:4,plate:'LL-8821',type:'Heavy Vehicle',make:'Isuzu',model:'NPR',year:2018,mileage:220000,customerId:2}],parts:[{id:1,sku:'OIL-5W30',name:'Engine Oil 5W-30 (1L)',price:3300,cost:2700,stock:36,min:8},{id:2,sku:'OIL-FILT',name:'Oil Filter',price:2400,cost:1700,stock:20,min:6},{id:3,sku:'BRK-PAD',name:'Brake Pad Set',price:8800,cost:6200,stock:5,min:8},{id:4,sku:'SPARK',name:'Spark Plug',price:1450,cost:990,stock:18,min:5}],jobs:[{id:1,vehicleId:1,title:'Oil & filter replacement',status:'In Progress',mechanic:'Kasun',labour:2500,parts:[{partId:1,qty:4},{partId:2,qty:1}],date:'2026-10-28',notes:'Change engine oil'} ,{id:2,vehicleId:2,title:'Brake inspection',status:'Pending',mechanic:'Ruwan',labour:1800,parts:[],date:'2026-10-29',notes:''}],appointments:[{id:1,vehicleId:3,date:'2026-10-30',time:'10:30',service:'Full service',status:'Scheduled'}],invoices:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)};let page='dashboard',lang=localStorage.getItem('autocare-lang')||'en';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>(state.settings.currency||'LKR')+' '+Number(v||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});const t=(en,si)=>lang==='si'?si:en;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const nextId=a=>Math.max(0,...a.map(x=>Number(x.id)||0))+1;const vehicle=id=>state.vehicles.find(x=>x.id===Number(id));const customer=id=>state.customers.find(x=>x.id===Number(id));const plate=id=>vehicle(id)?.plate||'—';const statusTag=s=>'<span class="tag '+(s==='Pending'?'warn':s==='In Progress'?'blue':s==='Scheduled'?'gray':'')+'">'+esc(s)+'</span>';function toast(msg){$('#toastroot').innerHTML='<div class="notice">'+esc(msg)+'</div>';setTimeout(()=>$('#toastroot').innerHTML='',3000)}function closeModal(){$('#modalroot').innerHTML=''}function modal(title,body,onSave){$('#modalroot').innerHTML='<div class="modalback"><div class="modal"><div class="modalhead"><h2>'+esc(title)+'</h2><button class="iconbtn" id="close">×</button></div><form id="editor" class="formgrid">'+body+'<div class="wide footer"><button class="secondary" id="cancel" type="button">'+t('Cancel','අවලංගු')+'</button><button class="primary" type="submit">'+t('Save','සුරකින්න')+'</button></div></form></div></div>';$('#close').onclick=$('#cancel').onclick=closeModal;$('#editor').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target))}}const field=(name,label,value='',type='text',extra='')=>'<label class="field">'+esc(label)+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+(name==='email'||(name==='phone'&&page==='settings')||name==='address'?'':' required')+'></label>';const opt=(name,label,options,value)=>'<label class="field">'+esc(label)+'<select name="'+name+'">'+options.map(o=>'<option '+(String(o[0])===String(value)?'selected':'')+' value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select></label>';const choices=(arr,key)=>arr.map(x=>[x.id,x[key]]);function render(){const labels={dashboard:[t('Overview','සාරාංශය'),t('Your workshop at a glance','ඔබගේ වැඩපොළ පිළිබඳ සාරාංශය')],vehicles:[t('Vehicles','වාහන'),t('Cars, bikes, three-wheelers & heavy vehicles','කාර්, මෝටර් සයිකල්, ත්‍රිරෝද රථ සහ බර වාහන')],customers:[t('Customers','පාරිභෝගිකයන්'),t('Customer records and contact details','පාරිභෝගික විස්තර')],jobs:[t('Job Cards','වැඩ ඇණවුම්'),t('Track repair work and labour','අලුත්වැඩියා කටයුතු')],appointments:[t('Appointments','වෙන්කරවා ගැනීම්'),t('Upcoming workshop visits','ඉදිරි සේවා වෙන්කිරීම්')],inventory:[t('Spare Parts','අමතර කොටස්'),t('Stock, codes and pricing','තොග, කේත සහ මිල')],invoices:[t('Invoices','බිල්පත්'),t('Invoices and payments','බිල්පත් හා ගෙවීම්')],settings:[t('Settings','සැකසුම්'),t('Garage branding and backup','ගරාජයේ විස්තර හා දත්ත උපස්ථ')]};$('#heading').textContent=labels[page][0];$('#subtitle').textContent=labels[page][1];document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);const en={dashboard:'Overview',vehicles:'Vehicles',customers:'Customers',jobs:'Job Cards',appointments:'Appointments',inventory:'Spare Parts',invoices:'Invoices',settings:'Settings'};const si={dashboard:'සාරාංශය',vehicles:'වාහන',customers:'පාරිභෝගිකයන්',jobs:'වැඩ ඇණවුම්',appointments:'වෙන්කිරීම්',inventory:'අමතර කොටස්',invoices:'බිල්පත්',settings:'සැකසුම්'};b.querySelector('label').textContent=lang==='si'?si[b.dataset.page]:en[b.dataset.page]});({dashboard:dash,vehicles:vehicles,customers:customers, jobs:jobs,appointments:appointments,inventory:inventory,invoices:invoices,settings:settings})[page]()}function openPage(p){page=p;render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));$('#lang').value=lang;$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('autocare-lang',lang);render()};function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}function dash(){const revenue=state.invoices.reduce((n,x)=>n+x.total,0);const active=state.jobs.filter(x=>x.status!=='Completed').length;const low=state.parts.filter(x=>x.stock<=x.min).length;$('#content').innerHTML='<div class="stats">'+[[t('Total Vehicles','මුළු වාහන'),state.vehicles.length,'🚘'],[t('Active Jobs','සක්‍රීය වැඩ'),active,'🛠'],[t('Invoiced Revenue','බිල් කළ ආදායම'),money(revenue),'💳'],[t('Low Stock Items','අඩු තොග'),low,'📦']].map(x=>'<div class="panel stat"><small>'+x[0]+'</small><i>'+x[2]+'</i><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="grid2"><div class="panel"><div class="sectiontop"><h2>'+t('Recent Job Cards','මෑත වැඩ ඇණවුම්')+'</h2><button class="secondary" onclick="openPage(\'jobs\')">'+t('View all','සියල්ල')+'</button></div>'+table(['#','Vehicle','Service','Status'],state.jobs.slice(0,6).map(x=>'<tr><td>#'+x.id+'</td><td>'+esc(plate(x.vehicleId))+'</td><td>'+esc(x.title)+'</td><td>'+statusTag(x.status)+'</td></tr>'))+'</div><div class="panel"><div class="sectiontop"><h2>'+t('Workshop Quick Actions','ඉක්මන් ක්‍රියා')+'</h2></div><div style="display:grid;gap:10px"><button class="primary" onclick="jobEdit()">+ '+t('New Job Card','නව වැඩ ඇණවුම')+'</button><button class="secondary" onclick="vehicleEdit()">+ '+t('Register Vehicle','වාහනයක් එක් කරන්න')+'</button><button class="secondary" onclick="appointmentEdit()">+ '+t('New Appointment','වෙන්කිරීමක්')+'</button><button class="secondary" onclick="openPage(\'invoices\')">'+t('Create Invoice','බිල්පතක්')+'</button></div><p class="callout">🔒 '+t('Demo data is stored only on this browser. Set up a secure database before real customer use.','මෙම දත්ත බ්‍රවුසරයේ පමණක් තබා ඇත. සැබෑ පාරිභෝගික භාවිතයට පෙර ආරක්ෂිත දත්ත ගබඩාවක් සකස් කරන්න.')+'</p></div></div>'}function vehicles(){let rows=state.vehicles.map(x=>'<tr><td><strong>'+esc(x.plate)+'</strong></td><td>'+esc(x.type)+'</td><td>'+esc(x.make+' '+x.model)+'</td><td>'+esc(customer(x.customerId)?.name||'—')+'</td><td>'+esc(x.mileage)+' km</td><td><div class="actions"><button class="secondary" onclick="vehicleEdit('+x.id+')">Edit</button><button class="secondary" onclick="openVehicleHistory('+x.id+')">History</button></div></td></tr>');$('#content').innerHTML='<div class="panel"><div class="toolbar"><input class="search" id="filter" placeholder="Search number / model..."><button class="primary" onclick="vehicleEdit()">+ '+t('Add Vehicle','වාහනයක් එක් කරන්න')+'</button></div><div id="listing">'+table(['Registration','Type','Vehicle','Owner','Mileage','Actions'],rows)+'</div></div>';$('#filter').oninput=e=>{const q=e.target.value.toLowerCase();$('#listing').innerHTML=table(['Registration','Type','Vehicle','Owner','Mileage','Actions'],state.vehicles.filter(x=>(x.plate+' '+x.type+' '+x.make+' '+x.model+' '+(customer(x.customerId)?.name||'')).toLowerCase().includes(q)).map(x=>'<tr><td>'+esc(x.plate)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.make+' '+x.model)+'</td><td>'+esc(customer(x.customerId)?.name)+'</td><td>'+esc(x.mileage)+' km</td><td><button class="secondary" onclick="vehicleEdit('+x.id+')">Edit</button></td></tr>'))}}function vehicleEdit(id){let v=state.vehicles.find(x=>x.id===id)||{plate:'',type:'Car',make:'',model:'',year:new Date().getFullYear(),mileage:0,customerId:state.customers[0]?.id};if(!state.customers.length){toast('Add a customer first');return}modal(id?'Edit Vehicle':'Add Vehicle',field('plate','Registration Number',v.plate)+opt('type','Vehicle Type',['Car','Motorcycle','Three-Wheeler','Heavy Vehicle','Van','Bus','Other'].map(x=>[x,x]),v.type)+field('make','Make',v.make)+field('model','Model',v.model)+field('year','Year',v.year,'number','min="1900" max="2100"')+field('mileage','Mileage (km)',v.mileage,'number','min="0"')+opt('customerId','Owner',state.customers.map(x=>[x.id,x.name]),v.customerId),f=>{const data={id:id||nextId(state.vehicles),plate:String(f.get('plate')).trim().toUpperCase(),type:f.get('type'),make:f.get('make'),model:f.get('model'),year:Number(f.get('year')),mileage:Number(f.get('mileage')),customerId:Number(f.get('customerId'))};if(state.vehicles.some(x=>x.id!==id&&x.plate===data.plate))return toast('Registration already exists');if(id)state.vehicles=state.vehicles.map(x=>x.id===id?data:x);else state.vehicles d>#'+x.id+'</td><td><strong>'+esc(plate(x.vehicleId))+'</strong></td><td>'+esc(x.title)+'</td><td>'+esc(x.mechanic||'—')+'</td><td>'+statusTag(x.status)+'</td><td>'+money(jobValue(x))+'</td><td><div class="actions"><button class="secondary" onclick="jobEdit('+x.id+')">Edit</button><button class="secondary" onclick="invoiceEdit('+x.id+')">Invoice</button></div></td></tr>'))+'</div>'}function jobEdit(id){if(!state.vehicles.length)return toast('Add vehicle first');let j=state.jobs.find(x=>x.id===id)||{vehicleId:state.vehicles[0].id,title:'',status:'Pending',mechanic:'',labour:0,parts:[],date:new Date().toISOString().slice(0,10),notes:''};let p=state.parts[0];modal(id?'Edit Job Card':'New Job Card',opt('vehicleId','Vehicle',state.vehicles.map(x=>[x.id,x.plate+' · '+x.make+' '+x.model]),j.vehicleId)+field('title','Service / Repair',j.title)+field('mechanic','Mechanic',j.mechanic)+opt('status','Status',['Pending','In Progress','Completed'].map(x=>[x,x]),j.status)+field('labour','Labour Charge (LKR)',j.labour,'number','min="0" step="0.01"')+field('date','Service Date',j.date,'date')+opt('partId','Spare Part (optional)',[[0,'None'],...state.parts.map(x=>[x.id,x.name+' (Stock '+x.stock+')'])],j.parts[0]?.partId||0)+field('qty','Part Quantity',j.parts[0]?.qty||0,'number','min="0"')+'<label class="field wide">Notes<textarea name="notes">'+esc(j.notes||'')+'</textarea></label>',f=>{let partId=Number(f.get('partId')),qty=Number(f.get('qty'));if(partId&&qty>0&&qty>state.parts.find(p=>p.id===partId).stock)return toast('Not enough parts in stock');let data={id:id||nextId(state.jobs),vehicleId:Number(f.get('vehicleId')),title:f.get('title'),mechanic:f.get('mechanic'),status:f.get('status'),labour:Number(f.get('labour')),date:f.get('date'),parts:partId&&qty>0?[{partId,qty}]:[],notes:f.get('notes')};if(id)state.jobs=state.jobs.map(x=>x.id===id?data:x);else state.jobs.push(data);save();closeModal();render();toast('Job saved')})}function appointments(){$('#content').innerHTML='<div clas tate.parts.find(x=>x.id===id)||{sku:'',name:'',price:0,cost:0,stock:0,min:5};modal(id?'Edit Spare Part':'Add Spare Part',field('sku','SKU / Barcode',a.sku)+field('name','Part Name',a.name)+field('price','Selling Price',a.price,'number','min="0" step="0.01"')+field('cost','Purchase Cost',a.cost,'number','min="0" step="0.01"')+field('stock','In Stock',a.stock,'number','min="0"')+field('min','Low Stock Alert',a.min,'number','min="0"'),f=>{const data={id:id||nextId(state.parts),sku:f.get('sku').trim(),name:f.get('name'),price:Number(f.get('price')),cost:Number(f.get('cost')),stock:Number(f.get('stock')),min:Number(f.get('min'))};if(state.parts.some(x=>x.id!==id&&x.sku===data.sku))return toast('SKU already exists');if(id)state.parts=state.parts.map(x=>x.id===id?data:x);else state.parts.push(data);save();closeModal();render();toast('Part saved')})}function invoices(){$('#content').innerHTML='<div class="panel"><div class="toolbar"><button class="primary" onclick="invoiceEdit()">+ '+t('Create Invoice','බිල්පතක් සාදන්න')+'</button></div>'+table(['Invoice','Date','Vehicle','Customer','Amount','Payment','Actions'],state.invoices.map(x=>'<tr><td><strong>'+esc(x.ref)+'</strong></td><td>'+esc(x.date)+'</td><td>'+esc(x.plate)+'</td><td>'+esc(x.customer)+'</td><td>'+money(x.total)+'</td><td>'+statusTag(x.payment)+'</td><td><button class="secondary" onclick="viewInvoice('+x.id+')">View / Print</button></td></tr>'))+'</div>'}function invoiceEdit(jobId){let eligible=state.jobs.filter(j=>!state.invoices.some(i=>i.jobId===j.id));if(jobId)eligible=eligible.filter(j=>j.id===jobId);if(!eligible.length)return toast('No uninvoiced jobs available');modal('Create Invoice',opt('jobId','Job card',eligible.map(j=>[j.id,'#'+j.id+' · '+plate(j.vehicleId)+' · '+j.title]),eligible[0].id)+field('discount','Discount (LKR)',0,'number','min="0" step="0.01"')+opt('payment','Payment Status',[['Unpaid','Unpaid'],['Paid externally','Paid externally']],'Unpaid')+'<p class="wide footnote">External payment sta x: '+money(i.tax)+'</p><p class="total">TOTAL: '+money(i.total)+'</p><p class="small muted">Payment: '+esc(i.payment)+' · Thank you for choosing us.</p></div><div class="footer no-print"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="window.print()">🖨 Print / Save PDF</button></div></div></div>'}function settings(){$('#content').innerHTML='<div class="panel" style="max-width:740px"><div class="sectiontop"><h2>'+t('Garage Profile','ගරාජයේ විස්තර')+'</h2></div><form id="settings" class="formgrid">'+field('name','Garage Name',state.settings.name)+field('phone','Phone',state.settings.phone,'text','placeholder="Phone"')+field('email','Email',state.settings.email,'email')+field('address','Address',state.settings.address)+opt('currency','Currency',['LKR','USD'].map(x=>[x,x]),state.settings.currency)+field('tax','Tax (%)',state.settings.tax,'number','min="0" max="100" step="0.01"')+'<div class="wide"><button class="primary">'+t('Save Settings','සුරකින්න')+'</button></div></form><div style="margin-top:24px" class="callout">'+t('This demo uses local browser storage and sample customers. Do not store real sensitive customer information until authentication, database, and backups are configured.','මෙම ආදර්ශය බ්‍රවුසරයේ තොරතුරු තබයි. ආරක්ෂිත දත්ත ගබඩාවක් හා පිවිසුමක් සකස් කරන තුරු සැබෑ පාරිභෝගික තොරතුරු දාන්න එපා.')+'</div><div class="footer" style="justify-content:start"><button class="secondary" id="backup">↓ Export backup</button><label class="secondary" style="padding:10px 15px;border-radius:10px;cursor:pointer">↑ Restore backup<input id="restore" type="file" accept=".json,application/json" hidden></label><button class="secondary" id="reset">Reset demo</button></div></div>';$('#settings').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.settings={...state.settings,name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address'),currency:f.get('currency'),tax:Number(f.get('tax'))};save();toast('Settings saved')};$('#backup').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='autocare-pro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('#restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.jobs)||!Array.isArray(d.vehicles)||!Array.isArray(d.customers)||!Array.isArray(d.parts)||!Array.isArray(d.invoices))throw Error('Invalid backup');if(!confirm('Replace local data?'))return;state=d;save();render();toast('Backup restored')}catch{toast('Invalid backup')}};$('#reset').onclick=()=>{if(confirm('Reset all local data to samples?')){state=structuredClone(seed);save();render()}}}render();
